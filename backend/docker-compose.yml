# Backend-only Docker Compose
# ─────────────────────────────────────────────────────────────────────
# Local dev  : reads secrets from .env file automatically
# Render     : env vars are injected by the platform, .env is ignored
# ─────────────────────────────────────────────────────────────────────

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: promptforge_backend
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env                 # loaded locally; on Render this file won't exist
    environment:
      # Any var set here takes precedence over .env
      # On Render, these are supplied via the dashboard Environment tab
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - DATABASE_URL=${DATABASE_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PORT=${PORT:-8000}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-120}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8000}/api/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
